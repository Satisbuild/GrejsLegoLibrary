<!doctype html>
<html lang="da">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' https: data:; connect-src 'self' https: http://localhost:* http://127.0.0.1:*; style-src 'self'; script-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" />
    <title>Log ind · GrejsLegoLibrary</title>
    <link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="assets/css/style.css" />
    <script type="module" src="assets/js/pages/login.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Spring til indhold</a>
    <header id="site-header" class="site-header"></header>

    <main id="main" class="container" tabindex="-1">
      <div class="auth-wrap">
        <div class="panel">
          <h1>Log ind</h1>
          <p class="meta-line">Velkommen tilbage til dit LEGO-bibliotek.</p>
          <form id="login-form" class="form" novalidate>
            <div class="form-alert" tabindex="-1" aria-live="polite"></div>
            <div class="field">
              <label for="email">E-mail</label>
              <input type="email" id="email" name="email" autocomplete="email" required maxlength="254" />
            </div>
            <div class="field">
              <label for="password">Adgangskode</label>
              <input type="password" id="password" name="password" autocomplete="current-password" required maxlength="128" />
            </div>
            <button type="submit" class="btn btn-primary btn-block">Log ind</button>
          </form>
        </div>
        <p class="auth-alt">Har du ikke en konto? <a href="register.html">Opret en gratis konto</a></p>
      </div>
    </main>

    <footer class="site-footer">
      <div class="container">
        <p>GrejsLegoLibrary er et uafhængigt hobbyprojekt og er ikke tilknyttet eller godkendt af LEGO Group.</p>
      </div>
    </footer>
  </body>
</html>
